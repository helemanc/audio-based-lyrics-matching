[project]
name = "audio-based-lyrics-matching"
version = "0.1.0"
description = "WEALY: Whisper Embeddings for Audio-based Lyrics Matching"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchaudio",
    "torchinfo",
    "lightning",
    "omegaconf",
    "numpy",
    "pandas",
    "scikit-learn",
    "sentence-transformers",
    "einops",
    "nltk",
    "tqdm",
    "pyyaml",
    "openai-whisper @ git+https://github.com/helemanc/whisper.git",
]

[tool.uv.sources]
# Linux (HPC): pulls CUDA-enabled torch; adjust cu124 to match your cluster's CUDA version
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
# On Linux/HPC, redirect cache to scratch to avoid home directory quota
# Run: UV_CACHE_DIR=/scratch.hpc/.../cache uv sync
